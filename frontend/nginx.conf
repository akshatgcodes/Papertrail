server {
    listen 80;
    root /usr/share/nginx/html;
    # Uploads are capped at 20 MB by the API; leave room for the form encoding
    client_max_body_size 25m;

    # Same origin as the app, so the session cookie needs no CORS setup
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Answers stream as server-sent events: pass each piece on as it comes
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Client-side routes (/library, /d/12) fall back to the SPA
    location / {
        try_files $uri /index.html;
    }
}
